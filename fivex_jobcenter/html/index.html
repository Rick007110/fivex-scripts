<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FiveX Jobs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="hidden" role="dialog" aria-label="FiveX Jobs">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-name">FiveX Jobs</div>
          <div class="brand-sub">City employment board</div>
        </div>
      </div>
      <button type="button" class="icon-btn" id="btn-close" title="Close">Esc</button>
    </header>

    <section class="status card" id="status">
      <div class="status-row">
        <div>
          <div class="kicker">Current job</div>
          <div class="status-job" id="cur-job">Unemployed</div>
        </div>
        <div class="status-pay">
          <div class="kicker">Balance</div>
          <div class="status-job" id="cur-pay">$0</div>
        </div>
      </div>
      <div class="status-duty muted" id="cur-duty"></div>
    </section>

    <section class="jobs" id="jobs"></section>

    <footer class="foot">
      <button type="button" class="btn danger hidden" id="btn-leave">Leave job</button>
      <span class="muted hint">E at the clerk · /jobcenter · Esc closes</span>
    </footer>
  </div>

  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true">
    <form class="modal" id="modal-form">
      <h2>Leave this job?</h2>
      <p class="muted" id="modal-body">You will clock off and lose the current assignment.</p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">Stay</button>
        <button type="submit" class="btn danger">Leave</button>
      </div>
    </form>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="work-progress" class="hidden" aria-hidden="true">
    <div class="work-progress-ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="work-progress-track" cx="50" cy="50" r="42"></circle>
        <circle class="work-progress-arc" id="work-progress-arc" cx="50" cy="50" r="42"></circle>
      </svg>
      <span class="work-progress-pct" id="work-progress-pct">0%</span>
    </div>
    <div class="work-progress-label" id="work-progress-label">Working</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
