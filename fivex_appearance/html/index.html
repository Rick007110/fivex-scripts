<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FiveX Appearance</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="hidden" role="application" aria-label="FiveX Appearance">
    <aside id="dock" class="store">
      <header class="store-head">
        <div class="store-title">
          <div class="store-mode" id="brand-sub">Clothing store</div>
          <h1 id="tab-title">Tops</h1>
        </div>
        <div class="head-actions">
          <button type="button" class="hbtn" id="btn-rand" title="Randomize this category">
            <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button type="button" class="hbtn" id="btn-reset" title="Back to your saved look">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </header>

      <nav class="groups" id="groups" aria-label="Groups"></nav>
      <nav class="cats" id="tabs" aria-label="Categories"></nav>
      <div id="banner" class="banner hidden"></div>

      <main class="panel" id="panel" tabindex="-1"></main>

      <footer class="store-foot">
        <button type="button" class="btn ghost" id="btn-esc">Cancel</button>
        <button type="button" class="btn primary" id="btn-save">
          <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span>Save look</span>
        </button>
      </footer>
    </aside>

    <div class="cam" id="cam-row">
      <div class="cam-pills">
        <button type="button" data-cam="face">Face</button>
        <button type="button" data-cam="torso">Torso</button>
        <button type="button" data-cam="legs">Legs</button>
        <button type="button" class="active" data-cam="full">Full</button>
        <span class="sep"></span>
        <button type="button" id="cam-flip" title="Turn around (Space)">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
      <div class="cam-hint" id="cam-hint">Drag to rotate · Scroll to zoom · Space to turn</div>
    </div>
  </div>

  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true">
    <form class="modal" id="modal-form">
      <h2 id="modal-title">Confirm</h2>
      <p id="modal-body" class="muted"></p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="modal-ok">Confirm</button>
      </div>
    </form>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
