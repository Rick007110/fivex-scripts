<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>fivex_drone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="osd" class="hidden">
        <canvas id="noise" width="320" height="180"></canvas>
        <div id="scan"></div>
        <div id="vignette"></div>

        <div class="corner tl" id="batt">
            <div><span id="volt">16.8V</span> <span id="cell" class="dim">4.20</span></div>
            <div id="mah">0mAh</div>
        </div>
        <div class="corner tr">
            <div id="time">00:00</div>
            <div>LQ <span id="lq">100</span></div>
        </div>
        <div class="corner bl">
            <div id="mode">ANGL</div>
            <div>THR <span id="thr">0</span>%</div>
            <div class="dim">CAM <span id="tilt">20</span>°</div>
        </div>
        <div class="corner br">
            <div>ALT <span id="alt">0</span>m</div>
            <div>SPD <span id="spd">0</span>km/h</div>
            <div>HOME <span id="home">0</span>m</div>
        </div>

        <div id="horizon"><div class="line"></div></div>
        <div id="cross">-◆-</div>
        <div id="warn"></div>
        <div id="kami"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
