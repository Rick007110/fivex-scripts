<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FiveX Zombies</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay" class="overlay hidden" aria-live="assertive" aria-atomic="true">
    <div class="frame" id="frame">
      <div class="eyebrow" id="eyebrow">FIVEX · EVENT</div>
      <h1 class="title" id="title">APOCALYPSE</h1>
      <p class="subtitle" id="subtitle">All civs infected — prepare</p>
      <div class="grace hidden" id="grace-wrap">
        <span class="grace-label">GRACE</span>
        <span class="grace-val" id="grace">0</span>
        <span class="grace-unit">s</span>
      </div>
      <div class="rule" aria-hidden="true"></div>
      <p class="brand">112 Play Theory</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
