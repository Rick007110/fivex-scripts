<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KnoWay Ride</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="hud.css" />
</head>
<body>
  <section id="hud" class="hud hidden" aria-live="polite">
    <div class="hud-top">
      <img class="hud-logo" src="logo.svg" alt="" />
      <div class="hud-text">
        <div class="hud-brand">KnoWay</div>
        <div class="hud-title" id="h-title">Finding your KnoWay</div>
        <div class="hud-sub" id="h-sub"></div>
      </div>
      <div class="hud-pulse" id="h-pulse" aria-hidden="true"></div>
    </div>
    <div class="hud-progress hidden" id="h-progress"><span id="h-bar"></span></div>
    <div class="hud-actions" id="h-actions">
      <button type="button" class="hbtn go" id="h-go"><kbd id="k-go">Y</kbd><span>Go</span></button>
      <button type="button" class="hbtn cancel" id="h-cancel"><kbd id="k-cancel">X</kbd><span>Cancel ride</span></button>
    </div>
    <div class="hud-hint" id="h-hint"><kbd id="k-cursor">ALT</kbd> mouse</div>
  </section>
  <script src="hud.js"></script>
</body>
</html>
