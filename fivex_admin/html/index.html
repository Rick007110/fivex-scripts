<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FiveX Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app hidden" role="application" aria-label="FiveX Admin">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <div>
          <div class="brand-name">FiveX Admin</div>
          <div class="brand-sub" id="brand-sub">Staff panel</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <span><kbd>Ctrl</kbd><kbd>K</kbd> commands</span>
        <span><kbd>Esc</kbd> close</span>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="page-head">
          <h1 id="page-title">Players</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="topbar-right">
          <div class="target-chip hidden" id="target-chip" title="Selected player — used by player actions everywhere">
            <span class="avatar sm" id="target-avatar"></span>
            <span class="target-text"><span class="muted">Target</span> <b id="target-name"></b> <span class="muted" id="target-id"></span></span>
            <button type="button" class="chip-x" id="target-clear" aria-label="Clear target">✕</button>
          </div>
          <button type="button" class="search-btn" id="btn-palette">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span>Search actions…</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button type="button" class="icon-btn" id="btn-close" title="Close (Esc)" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </section>
  </div>

  <!-- Command palette -->
  <div id="palette" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette">
      <div class="palette-input-row">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="palette-input" type="text" placeholder="Type a command, player or keyword…" autocomplete="off" spellcheck="false" />
      </div>
      <ul id="palette-list" class="palette-list"></ul>
      <div class="palette-hint"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> run</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>

  <!-- Confirm / reason modal -->
  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true">
    <form class="modal" id="modal-form" novalidate>
      <div class="modal-icon" id="modal-icon"></div>
      <h2 id="modal-title">Confirm</h2>
      <p id="modal-body" class="muted"></p>
      <div id="modal-fields"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn danger" id="modal-ok">Confirm</button>
      </div>
    </form>
  </div>

  <!-- Server announcement (shown to everyone) -->
  <div id="announce" class="announce hidden">
    <div class="announce-kicker"><span class="dot"></span><span id="announce-author">Announcement</span></div>
    <div id="announce-msg"></div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
